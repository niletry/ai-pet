<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      /* 背景透明 */
    }
  
    #pet-container {
      width: 200px;
      height: 200px;
      pointer-events: auto;
      cursor: grab;
      position: relative;
    }
  
    #pet-sprite {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 300% 300%; /* 3x3 grid */
      image-rendering: pixelated; /* Crisp pixel art */
      
      /* Float animation */
      animation: float 3s ease-in-out infinite;
      
      /* Disable interactions */
      pointer-events: none;
    }
  
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
  </head>
<body>
  <div id="pet-container" data-tauri-drag-region>
    <div id="pet-sprite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
