<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      /* 背景透明 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  
    #pet-container {
      width: 100px;
      height: 100px;
      pointer-events: auto;
      cursor: grab;
      position: relative;
    }
  
    #pet-sprite {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      image-rendering: pixelated; /* Crisp pixel art */
      
      /* Float animation */
      animation: float 3s ease-in-out infinite;
      
      /* Disable interactions */
      pointer-events: none;
    }
  
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Speech Bubble */
    .speech-bubble {
        position: absolute;
        bottom: 110%; /* Above the pet */
        left: 50%;
        transform: translateX(-50%);
        background-color: white;
        color: black;
        border-radius: 10px;
        padding: 8px 12px;
        font-family: 'Arial', sans-serif; /* Fallback for Chinese characters */
        font-size: 14px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        white-space: normal; /* Enable wrapping */
        word-break: break-word;
        width: max-content;
        max-width: 160px; /* Leave room in 200px window */
        text-align: center;
        z-index: 10;
        border: 1px solid #ccc;
    }

    /* Little arrow for the bubble */
    .speech-bubble::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: white transparent transparent transparent;
    }

    .hidden {
        display: none;
    }

    /* Radial Menu */
    #radial-menu {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      z-index: 20;
      pointer-events: none; /* Let container handle clicks unless active */
    }
    .menu-item {
      position: absolute;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      background-color: white;
      border: 1px solid #ccc;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: auto; /* Active when visible */
    }
    
    .menu-item:hover {
      background-color: #f0f0f0;
      /* removed transform override here to prevent losing translate position */
    }

    #radial-menu.active .menu-item {
      opacity: 1;
    }

    /* Positions (Radius = ~65px to clear the pet) */
    #radial-menu.active .menu-top { transform: translate(0, -65px) scale(1); }
    #radial-menu.active .menu-right { transform: translate(65px, 0) scale(1); }
    #radial-menu.active .menu-bottom { transform: translate(0, 65px) scale(1); }
    #radial-menu.active .menu-left { transform: translate(-65px, 0) scale(1); }

    /* Hover scales for each position so they maintain their translation */
    #radial-menu.active .menu-top:hover { transform: translate(0, -65px) scale(1.1); }
    #radial-menu.active .menu-right:hover { transform: translate(65px, 0) scale(1.1); }
    #radial-menu.active .menu-bottom:hover { transform: translate(0, 65px) scale(1.1); }
    #radial-menu.active .menu-left:hover { transform: translate(-65px, 0) scale(1.1); }

    /* When hidden, reset transforms so they shrink back to center */
    #radial-menu:not(.active) .menu-item {
      transform: translate(0, 0) scale(0);
    }
  </style>
  </head>
<body>
  <div id="pet-container">
    <div id="radial-menu">
      <div class="menu-item menu-top" id="menu-switch" title="Switch Character">🔄</div>
      <div class="menu-item menu-right" id="menu-settings" title="Settings">⚙️</div>
      <div class="menu-item menu-bottom" id="menu-talk" title="Talk">💬</div>
      <div class="menu-item menu-left" id="menu-close" title="Close App">❌</div>
    </div>
    <div id="speech-bubble" class="speech-bubble hidden"></div>
    <div id="pet-sprite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
