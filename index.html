<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      /* 背景透明 */
    }
  
    #pet-container {
      width: 200px;
      height: 200px;
      pointer-events: auto;
      /* 允许点击宠物 */
      cursor: grab;
    }
  
    img {
      width: 100%;
      height: auto;
      /* 这里可以加入简单的浮动动画 */
      animation: float 3s ease-in-out infinite;
      /* 禁用图片的默认拖拽行为 */
      -webkit-user-drag: none;
      user-drag: none;
      -webkit-user-select: none;
      user-select: none;
      pointer-events: none;
    }
  
    @keyframes float {
  
      0%,
      100% {
        transform: translateY(0);
      }
  
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
  </head>
<body>
  <div id="pet-container" data-tauri-drag-region>
    <img
      src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueW9ueW9ueW9ueW9ueW9ueW9ueW9ueW9ueW9ueW9ueW9ueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/3o7TKMGpxN3O9D6M0w/giphy.gif"
      alt="pet">
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
