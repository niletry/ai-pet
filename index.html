<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: transparent;
      /* 背景透明 */
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 100vh;
    }
  
    #pet-container {
      width: 100px;
      height: 100px;
      pointer-events: auto;
      cursor: grab;
      position: relative;
    }
  
    #pet-sprite {
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 300% 300%; /* 3x3 grid */
      image-rendering: pixelated; /* Crisp pixel art */
      
      /* Float animation */
      animation: float 3s ease-in-out infinite;
      
      /* Disable interactions */
      pointer-events: none;
    }
  
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* Speech Bubble */
    .speech-bubble {
        position: absolute;
        bottom: 110%; /* Above the pet */
        left: 50%;
        transform: translateX(-50%);
        background-color: white;
        color: black;
        border-radius: 10px;
        padding: 8px 12px;
        font-family: 'Arial', sans-serif; /* Fallback for Chinese characters */
        font-size: 14px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        white-space: nowrap;
        z-index: 10;
        border: 1px solid #ccc;
    }

    /* Little arrow for the bubble */
    .speech-bubble::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: white transparent transparent transparent;
    }

    .hidden {
        display: none;
    }
  </style>
  </head>
<body>
  <div id="pet-container">
    <div id="speech-bubble" class="speech-bubble hidden"></div>
    <div id="pet-sprite"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
